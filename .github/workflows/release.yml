name: Release Windows installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_REPOSITORY: YankyAppel/SUMA-store-POS-releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Prepare manager release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" --repo "$env:RELEASE_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --repo "$env:RELEASE_REPOSITORY" --title "${{ github.ref_name }}" --notes "Windows installers for ${{ github.ref_name }}." --draft
          }
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      - name: Bake in the Google OAuth client
        run: node apps/manager/scripts/set-google-oauth-client.mjs
        env:
          SUMA_GOOGLE_CLIENT_ID: ${{ secrets.SUMA_GOOGLE_CLIENT_ID }}
          SUMA_GOOGLE_CLIENT_SECRET: ${{ secrets.SUMA_GOOGLE_CLIENT_SECRET }}
      # BUILD_ARCH gives each arch its own single-arch installer (~half the
      # download) and per-arch update channels (latest-arm64.yml /
      # kiosk-arm64.yml) so ARM machines keep pulling the arm64 build. Each
      # run also emits a zip payload — install-free escape hatch for machines
      # where the NSIS stub can't complete.
      - name: Package manager installer (x64)
        run: npm run package:publish -w @shul-store/manager
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          BUILD_ARCH: x64
      - name: Package manager installer (ARM64)
        run: npm run package:publish:arm64 -w @shul-store/manager
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SUMA_UPDATE_CHANNEL: latest-arm64
          ARTIFACT_SUFFIX: -arm64
          BUILD_ARCH: arm64
      - name: Package kiosk installer (x64)
        run: npm run package:publish -w @shul-store/kiosk
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          BUILD_ARCH: x64
      - name: Package kiosk installer (ARM64)
        run: npm run package:publish:arm64 -w @shul-store/kiosk
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SUMA_UPDATE_CHANNEL: kiosk-arm64
          ARTIFACT_SUFFIX: -arm64
          BUILD_ARCH: arm64
      - uses: actions/upload-artifact@v4
        with:
          name: shul-store-windows-installers
          path: |
            apps/manager/release/*.exe
            apps/kiosk/release/*.exe
          if-no-files-found: error
      - name: Publish complete release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $release = gh release view "${{ github.ref_name }}" --repo "$env:RELEASE_REPOSITORY" --json isDraft | ConvertFrom-Json
          if ($release.isDraft) {
            gh release edit "${{ github.ref_name }}" --repo "$env:RELEASE_REPOSITORY" --draft=false
          }
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
