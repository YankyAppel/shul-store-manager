name: Release Windows installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_REPOSITORY: YankyAppel/shul-store-manager-releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Package manager installer
        run: npm run package:publish -w @shul-store/manager
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Package kiosk installer
        run: npm run package -w @shul-store/kiosk
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: shul-store-windows-installers
          path: |
            apps/manager/release/*.exe
            apps/kiosk/release/*.exe
          if-no-files-found: error
      - name: Publish kiosk installer to release repository
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/kiosk/release -Filter *.exe
          gh release upload "${{ github.ref_name }}" $installer.FullName --repo "$env:RELEASE_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
